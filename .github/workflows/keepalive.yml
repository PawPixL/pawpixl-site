# Keeps the free Supabase project awake (free projects pause after 7 days with no activity).
# Uses the public anon key from content/site.json, so there is nothing to configure.
name: Keep fan accounts awake
on:
  schedule: [{ cron: "17 9 */3 * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          URL=$(jq -r '.auth.url // empty' content/site.json)
          KEY=$(jq -r '.auth.anon // empty' content/site.json)
          if [ -z "$URL" ]; then echo "Fan accounts not set up yet"; exit 0; fi
          curl -fsS "$URL/rest/v1/ping?select=id" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
