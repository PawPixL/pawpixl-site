<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080a14">
<title>You're offline — PawPixl</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/app.css">
<style>
.offl{max-width:560px;margin:56px auto 0;text-align:center;padding:0 4px}
.offl img{width:84px;height:84px;border-radius:50%}
.offl h1{font-size:clamp(34px,8vw,48px);margin:16px 0 8px}
.offl p{color:var(--mut);line-height:1.6;margin:0 0 18px}
.offl ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;text-align:left}
.offl li a{display:block;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass);text-decoration:none;font-weight:600}
.offl li a:hover{border-color:var(--line2)}
.offl h2{font:800 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--e2);margin:28px 0 10px;text-align:left}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="/">PawPixl</a></div></header>
<main class="wrap">
 <div class="offl">
  <img src="/icons/icon-192.png" alt="" width="84" height="84">
  <h1 class="disp">You're offline</h1>
  <p>PawPixl couldn't reach the internet. Guides you opened recently are saved on this device and still work.</p>
  <a class="btn go" href="/" id="retry">Try again</a>
  <div id="saved" hidden><h2>Saved on this device</h2><ul id="savedlist"></ul></div>
 </div>
</main>
<script src="/offline.js" defer></script>
</body>
</html>
